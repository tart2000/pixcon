# Rebuilds the paid bundle (scripts/build-bundle.mjs) and uploads it to the private Blob store, so buyers' links
# always serve every validated icon. Runs as soon as a production deploy succeeds (publishing the kit on /manage
# deploys), with an hourly run as a safety net; only rebuilds when the icons or the drawing code changed.
name: Build the bundle

on:
  deployment_status:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency: build-bundle

jobs:
  build:
    if: github.event_name != 'deployment_status' || (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      # The files drawn by the last run, so this one only draws what changed (see scripts/build-bundle.mjs).
      - uses: actions/cache/restore@v4
        with:
          path: .bundle-cache
          key: bundle-${{ github.run_id }}
          restore-keys: bundle-
      - run: node scripts/build-bundle.mjs --upload
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
      # Saved under what it holds: a run that changed nothing finds that key taken and saves nothing.
      - uses: actions/cache/save@v4
        if: hashFiles('.bundle-cache/manifest.json') != ''
        with:
          path: .bundle-cache
          key: bundle-${{ hashFiles('.bundle-cache/manifest.json') }}
