# Static export of the public site (gallery + requests) to GitHub Pages.
# Icons are read from Neon at build time, so the site is rebuilt on every push,
# daily, and on demand (Actions → "Deploy to GitHub Pages" → Run workflow).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # One job, so the build can read DATABASE_URL from the github-pages environment secrets.
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Check DATABASE_URL secret
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Missing DATABASE_URL secret (Settings → Environments → github-pages, or a repository secret)."
            exit 1
          fi
      - run: npm ci
      - run: npm run build
        env:
          GITHUB_PAGES: "true"
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: out
      - id: deployment
        uses: actions/deploy-pages@v4
