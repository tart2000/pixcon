# Mirrors the kit to npm (and so jsDelivr) as `pixiconsio`, so sites can still load it if www.pixicons.io can't
# serve it. Runs as soon as a production deploy succeeds (publishing the kit on /manage deploys), with an hourly
# run as a safety net; publishes only when the validated icons changed.
name: Publish kit to npm

on:
  deployment_status:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # A deployment_status run has no branch, and npm's provenance check refuses a signature without one:
  # start a regular run on main instead.
  after-deploy:
    if: github.event_name == 'deployment_status' && github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh workflow run publish-kit.yml --repo "$GITHUB_REPOSITORY" --ref main
        env:
          GH_TOKEN: ${{ github.token }}

  publish:
    if: github.event_name != 'deployment_status'
    runs-on: ubuntu-latest
    concurrency: publish-kit
    permissions:
      contents: read
      id-token: write # npm trusted publishing (no token) and provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build:kit
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - run: node scripts/publish-kit.mjs
